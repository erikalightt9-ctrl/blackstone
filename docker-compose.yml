# Financial Monitoring on your own server, under your own domain.
#
#   cp .env.example .env      then set DOMAIN in it
#   docker compose up -d --build
#
# The app is published on 127.0.0.1 only, so nothing outside this machine can reach it
# directly. The server's own web server answers for DOMAIN and forwards to it - one site block,
# given in DEPLOY.md section 4c.
#
# A server with no web server of its own can run the bundled Caddy instead, which takes ports
# 80 and 443 and gets the certificate by itself:
#
#   docker compose --profile caddy up -d --build

name: blackstone

services:
  blackstone:
    build: .
    image: blackstone:latest
    container_name: blackstone
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BLACKSTONE_PORT:-3303}:3403"
    environment:
      FR_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env}
      # Who may tell the app a visitor's real address. A web server on this machine reaches the
      # container through the network's gateway (.1); the bundled Caddy has a fixed address
      # (.2). Nothing else on the network is believed, which is what keeps each visitor's
      # login limit their own.
      FR_TRUSTED_PROXIES: ${FR_TRUSTED_PROXIES:-172.28.0.1,172.28.0.2}
      FR_SETUP_TOKEN: ${FR_SETUP_TOKEN:-}
      FR_KEEP_BACKUPS: ${FR_KEEP_BACKUPS:-240}
      # Each verified backup is also copied out of the volume, into ./backups on the host,
      # so the server's own backup routine can pick it up.
      FR_BACKUP_COPY_TO: /backups
      FR_MAIL_FROM: ${FR_MAIL_FROM:-}
      FR_SMTP_HOST: ${FR_SMTP_HOST:-}
      FR_SMTP_PORT: ${FR_SMTP_PORT:-587}
      FR_SMTP_USER: ${FR_SMTP_USER:-}
      FR_SMTP_PASS: ${FR_SMTP_PASS:-}
      FR_SMTP_SECURE: ${FR_SMTP_SECURE:-}
      FR_SMTP_URL: ${FR_SMTP_URL:-}
    volumes:
      - data:/data                # the database and its hourly backups; never delete this volume
      - ./backups:/backups        # second copy of every backup, outside the volume
    networks:
      blackstone:
        ipv4_address: 172.28.0.3

  # Only for a server that has no web server on 80 and 443 already.
  caddy:
    profiles: [caddy]
    image: caddy:2
    container_name: blackstone-caddy
    restart: unless-stopped
    depends_on:
      blackstone:
        condition: service_healthy
    ports:
      - "80:80"                   # needed for the certificate challenge and the redirect to https
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy-data:/data          # the certificates; keeping them avoids re-issuing on restart
      - caddy-config:/config
    networks:
      blackstone:
        ipv4_address: 172.28.0.2

networks:
  blackstone:
    name: blackstone
    ipam:
      config:
        # Change this (and the addresses above, and FR_TRUSTED_PROXIES) only if it clashes
        # with a network the server already uses.
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  data:
  caddy-data:
  caddy-config:
